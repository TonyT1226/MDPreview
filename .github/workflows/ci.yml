name: CI

on:
  push:
    branches: [main, v1.1]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app || sudo xcode-select -s /Applications/Xcode.app

      - name: Swift version
        run: swift --version

      - name: Build core (SwiftPM)
        run: swift build

      - name: Run tests (SwiftPM)
        run: swift test

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build macOS app
        run: |
          xcodebuild \
            -project MDPreview.xcodeproj \
            -scheme MDPreview \
            -configuration Debug \
            -derivedDataPath .xcbuild \
            CODE_SIGNING_ALLOWED=NO \
            build
