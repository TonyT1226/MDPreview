# XcodeGen 配置 —— 生成 MDPreview.xcodeproj
# 再生成：brew install xcodegen && xcodegen generate
name: MDPreview
options:
  bundleIdPrefix: com.mdpreview
  developmentLanguage: en
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  minimumXcodeGenVersion: "2.38.0"

settings:
  base:
    MARKETING_VERSION: "1.6.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    DEVELOPMENT_TEAM: 6R935F5ZPV
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES

packages:
  MDPreviewCore:
    path: .

targets:
  MDPreview:
    type: application
    platform: macOS
    sources:
      - path: Sources/App
      # 隐私清单（required-reason API：UserDefaults、stat/fstat）。三个 target 都链接 MDPreviewCore，都要带
      - path: Sources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: MDPreviewCore
        product: MDPreviewCore
      - target: MDPreviewQuickLook
      - target: MDPreviewThumbnail
    # Mac App Store 要求开沙盒。同目录的图片、链接的文档靠用户授权文件夹（FolderAccess）
    entitlements:
      path: Sources/App/MDPreview.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        com.apple.security.network.client: true
        com.apple.security.print: true
    settings:
      base:
        PRODUCT_NAME: MDPreview
        PRODUCT_BUNDLE_IDENTIFIER: com.mdpreview.app
        INFOPLIST_FILE: Sources/App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
        SWIFT_EMIT_LOC_STRINGS: YES
    scheme:
      testTargets:
        - package: MDPreviewCore/MDPreviewCoreTests
      gatherCoverageData: false

  # Finder 空格预览
  MDPreviewQuickLook:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/QuickLookPreview
      - path: Sources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: MDPreviewCore
        product: MDPreviewCore
      - sdk: QuickLookUI.framework
    info:
      path: Sources/QuickLookPreview/Info.plist
      properties:
        CFBundleDisplayName: MDPreview Quick Look
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLIsDataBasedPreview: false
            QLSupportsSearchableItems: false
            QLSupportedContentTypes:
              - net.daringfireball.markdown
              - public.markdown
    entitlements:
      path: Sources/QuickLookPreview/QuickLookPreview.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdpreview.app.quicklook
        SKIP_INSTALL: YES

  # Finder 缩略图
  MDPreviewThumbnail:
    type: app-extension
    platform: macOS
    sources:
      - path: Sources/QuickLookThumbnail
      - path: Sources/PrivacyInfo.xcprivacy
        buildPhase: resources
    dependencies:
      - package: MDPreviewCore
        product: MDPreviewCore
      - sdk: QuickLookThumbnailing.framework
    info:
      path: Sources/QuickLookThumbnail/Info.plist
      properties:
        CFBundleDisplayName: MDPreview Thumbnail
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.thumbnail
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ThumbnailProvider
          NSExtensionAttributes:
            QLThumbnailMinimumDimension: 0
            QLSupportedContentTypes:
              - net.daringfireball.markdown
              - public.markdown
    entitlements:
      path: Sources/QuickLookThumbnail/QuickLookThumbnail.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mdpreview.app.thumbnail
        SKIP_INSTALL: YES
